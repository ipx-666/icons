<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Icons Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #f5f5f2;
        color: #1f2328;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
        max-width: 920px;
      }

      .icon {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 16px;
        background: #ffffff;
      }

      .icon img {
        display: block;
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin: 0 auto 12px;
      }

      .icon code {
        display: block;
        font-size: 13px;
        overflow-wrap: anywhere;
        color: #57606a;
      }
    </style>
  </head>
  <body>
    <h1>Icons Preview</h1>
    <main class="grid">
      <article class="icon">
        <img src="emby/sntp_shouhou.png" alt="sntp_shouhou">
        <code>emby/sntp_shouhou.png</code>
      </article>
    </main>
  </body>
</html>
